<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Imóvel</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="conteudo">

        <h1>Cadastrar imóvel</h1>

        <form id="form-imovel">

            <div class="campo">
                <label for="titulo">Nome/Título do imóvel</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex: Apartamento no Centro"
                    required
                >
            </div>

            <div class="campo">
                <label for="tipo">Tipo do imóvel</label>

                <select id="tipo" required>
                    <option value="">Selecione</option>
                    <option value="Casa">Casa</option>
                    <option value="Apartamento">Apartamento</option>
                    <option value="Terreno">Terreno</option>
                    <option value="Sala Comercial">Sala Comercial</option>
                </select>
            </div>

            <div class="campo">
                <label for="endereco">Endereço</label>
                <input
                    type="text"
                    id="endereco"
                    placeholder="Rua, número"
                    required
                >
            </div>

            <div class="campo">
                <label for="cidade">Cidade</label>
                <input
                    type="text"
                    id="cidade"
                    placeholder="Ex: Manaus"
                    required
                >
            </div>

            <div class="campo">
                <label for="valor">Valor</label>
                <input
                    type="number"
                    id="valor"
                    placeholder="Ex: 250000"
                    required
                >
            </div>

            <div class="campo">
                <label for="quartos">Quantidade de quartos</label>
                <input
                    type="number"
                    id="quartos"
                    min="0"
                    required
                >
            </div>

            <button type="submit">
                Cadastrar imóvel
            </button>

        </form>

    </main>

    <script src="js/cadastroImovel.js"></script>

</body>
</html>
