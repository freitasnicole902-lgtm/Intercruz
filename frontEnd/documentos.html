<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InterCruz - Documentos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="logo">
                <h2>INTERCRUZ</h2>
                <span>FUNDAÇÃO MANUEL CRUZ</span>
            </div>

            <nav>

                <a href="index.html" class="menu-item">
                     <img src="icons/tabDashboard.png" alt="" class="menu-icon">
                    <span>Dashboard</span>
                </a>

                <a href="imoveis.html" class="menu-item">
                    <img src="icons/tabImoveis.png" alt="" class="menu-icon">
                    <span>Imóveis</span>
                </a>

                <a href="contratos.html" class="menu-item">
                    <img src="icons/tabContratos.png" alt="" class="menu-icon">
                    <span>Contratos</span>
                </a>

                <a href="clientes.html" class="menu-item">
                    <img src="icons/tabClientes.png" alt="" class="menu-icon">
                    <span>Clientes</span>
                </a>

                <a href="financeiro.html" class="menu-item">
                    <img src="icons/tabFinanceiro.png" alt="" class="menu-icon">
                    <span>Financeiro</span>
                </a>

                <a href="documentos.html" class="menu-item active">
                    <img src="icons/documentosActivated.png" alt="" class="menu-icon">
                    <span>Documentos</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/tabPrestacao.png" alt="" class="menu-icon">
                    <span>Prestação de contas</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/tabRelatorios.png" alt="" class="menu-icon">
                    <span>Relatórios</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/configuracoes.png" alt="" class="menu-icon">
                    <span>Configurações</span>
                </a>

            </nav>  
            
            <div class="menu-sair">
                <img src="icons/iconSair.png" alt="" class="menu-icon">
                    <span>Sair</span>
            </div>

        </aside>


        <!-- CONTEÚDO -->
        <main class="main-content">

            <header class="topbar">
                <h1>Documentos</h1>
            </header>
 
            <section class="content">

               <div class="page-header">

                <div>

                    <h2>Central de Documentos</h2>

                </div>


                <!-- BOTÃO QUE ABRE O MODAL -->

                <button
                    type="button"
                    id="btn-novo-documento"
                    class="btn-novo-imovel">

                    + Novo documento

                </button>

            </div>

            <div class="contratos-filtros">
                <input type="search"
                       id="busca-contrato"
                       placeholder="⌕ Buscar por título/imóvel/contrato...">

                       <!-- FILTROS POR CATEGORIA -->
                <div class="filtros-categorias">
                    <button type="button" class="filtro-chip active" data-categoria="todos">Todos</button>
                    <button type="button" class="filtro-chip" data-categoria="contratos">Contratos</button>
                    <button type="button" class="filtro-chip" data-categoria="comprovantes">Comprovantes</button>
                    <button type="button" class="filtro-chip" data-categoria="imoveis">Imóveis</button>
                    <button type="button" class="filtro-chip" data-categoria="vistorias">Vistorias</button>
                    <button type="button" class="filtro-chip" data-categoria="financeiro">Financeiro</button>
                    <button type="button" class="filtro-chip" data-categoria="prestacao-de-contas">Prestação de contas</button>
                    <button type="button" class="filtro-chip" data-categoria="outros">Outros</button>
                </div>
            </div>

            <div class="table-container">

                <table class="table">

                    <thead>

                        <tr>

                            <th>Título</th>

                            <th>Categoria</th>

                            <th>Contrato</th>

                            <th>Cliente</th>

                            <th>Data</th>

                        </tr>

                    </thead>


                    <tbody id="lista-documentos">

                        <tr>

                            <td colspan="6">Nenhum documento cadastrado.</td>

                        </tr>
                    </tbody>

                </table>

            </div>
                

            </section>

        </main>

    </div>

    <!-- MODAL NOVO DOCUMENTO -->

<div id="modal-documento" class="modal-contrato-overlay">

    <div class="modal-contrato">

        <div class="modal-contrato-cabecalho">

            <h2>Novo documento</h2>

            <button
                type="button"
                class="modal-contrato-fechar"
                id="btn-fechar-documento">
                &times;
            </button>

        </div>

        <form id="form-documento">

            <div class="contrato-form-grid documento-form-grid">

                <!-- TÍTULO -->
                <div class="campo completo">
                    <label for="titulo-documento">Título</label>
                    <input
                        type="text"
                        id="titulo-documento"
                        required>
                </div>

                <!-- CATEGORIA -->
                <div class="campo">
                    <label for="categoria-documento">Categoria</label>

                    <select id="categoria-documento" required>
                        <option value="comprovantes">Comprovantes</option>
                        <option value="contratos">Contratos</option>
                        <option value="financeiro">Financeiro</option>
                        <option value="vistoria">Vistoria</option>
                        <option value="prestacao-de-contas">Prestação de contas</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <!-- DATA -->
                <div class="campo">
                    <label for="data-documento">Data</label>
                    <input
                        type="date"
                        id="data-documento"
                        required>
                </div>

                <!-- IMÓVEL -->
                <div class="campo">
                    <label for="imovel-documento">Imóvel</label>

                    <select id="imovel-documento">
                        <option value="">Sem imóvel vinculado</option>
                    </select>
                </div>

                <!-- VÍNCULO -->
                <div class="campo vinculo">
                    <label for="vinculo-documento">Vínculo</label>

                    <select id="vinculo-documento">
                        <option value="">Selecione</option>
                        <option value="contrato">Contrato</option>
                        <option value="cliente">Cliente</option>
                    </select>
                </div>

                <!-- NOME -->
                <div class="campo completo">
                    <label for="nome-documento">Nome</label>
                    <input
                        type="text"
                        id="nome-documento">
                </div>

                <!-- DESCRIÇÃO -->
                <div class="campo completo">
                    <label for="descricao-documento">Descrição</label>
                    <textarea
                        id="descricao-documento"
                        rows="3">
                    </textarea>
                </div>

                <!-- ARQUIVO -->
                <div class="campo completo">
                    <label for="arquivo-documento">Arquivo</label>
                    <input
                        type="file"
                        id="arquivo-documento"
                        accept=".pdf,.doc,.docx">
                </div>

            </div>

            <div class="modal-contrato-acoes">

                <button
                    type="button"
                    class="btn-cancelar-contrato"
                    id="btn-cancelar-documento">
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn-salvar">
                    Cadastrar documento
                </button>

            </div>

        </form>

    </div>

</div>
<script src="js/documento.js"></script>
</body>

</html>
