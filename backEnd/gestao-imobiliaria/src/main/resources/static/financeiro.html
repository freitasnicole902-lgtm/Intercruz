<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="logo">
                <h2>INTERCRUZ</h2>
                <span>FUNDAÇÃO MANUEL CRUZ</span>
            </div>

            <nav>

                <a href="index.html" class="menu-item">
                     <img src="icons/tabDashboard.png" alt="" class="menu-icon">
                    <span>Dashboard</span>
                </a>

                <a href="imoveis.html" class="menu-item">
                    <img src="icons/tabImoveis.png" alt="" class="menu-icon">
                    <span>Imóveis</span>
                </a>

                <a href="contratos.html" class="menu-item">
                    <img src="icons/tabContratos.png" alt="" class="menu-icon">
                    <span>Contratos</span>
                </a>

                <a href="clientes.html" class="menu-item">
                    <img src="icons/tabClientes.png" alt="" class="menu-icon">
                    <span>Clientes</span>
                </a>

                <a href="financeiro.html" class="menu-item active">
                    <img src="icons/financeiroActivated.png" alt="" class="menu-icon">
                    <span>Financeiro</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/tabDocumentos.png" alt="" class="menu-icon">
                    <span>Documentos</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/tabPrestacao.png" alt="" class="menu-icon">
                    <span>Prestação de contas</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/tabRelatorios.png" alt="" class="menu-icon">
                    <span>Relatórios</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/configuracoes.png" alt="" class="menu-icon">
                    <span>Configurações</span>
                </a>
            </nav>  
            
            <div class="menu-sair">
                <img src="icons/iconSair.png" alt="" class="menu-icon">
                <span>Sair</span>
            </div>

        </aside>


        <!-- CONTEÚDO -->
        <main class="main-content">

            <header class="topbar">
                <h1>Financeiro</h1>
            </header>
 
            <section class="content">

                 <div class="page-header">
                    <h2>Controle de finanças</h2>

                    <button type="button"
                        id="btn-nova-movimentacao"
                        class="btn-novo-contrato">
                        + Nova movimentação
                    </button>
                </div>

                <!-- CARDS -->
                <div class="cards">

                    <div class="card-dashboard">
                        <span>Total de receitas</span>
                        <strong>R$ 50.456,65</strong>
                    </div>

                    <div class="card-dashboard">
                        <span>Total de despesas</span>
                        <strong>R$ 23.632,86</strong>
                    </div>

                    <div class="card-dashboard">
                        <span>Saldo</span>
                        <strong>R$ 26.823,79</strong>
                    </div>

                </div>
          


            </section>

        </main>

    </div>


 <div id="modal-nova-movimentacao" class="modal-contrato-overlay">

    <div class="modal-contrato">

        <div class="modal-contrato-cabecalho">
            <h2>Nova Movimentação</h2>

            <button type="button" class="modal-contrato-fechar"
                id="btn-fechar-modal">&times;</button>
        </div>

        <form id="form-contrato">

            <div class="contrato-form-grid">

                <div class="campo">
                    <label>Descrição</label>
                    <input type="text" id="descricao">
                </div>

                <div class="campo">
                    <label>Tipo</label>
                    <select id="tipo-movimentacao">
                        <option value="Entrada">Entrada</option>
                        <option value="Saída">Saída</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Categoria</label>
                    <select id="categoria-movimentacao">
                        <option value="Aluguel">Aluguel</option>
                        <option value="IPTU">IPTU</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="codigo-imovel">Imóvel</label>
                    <select id="codigo-imovel">
                        <option value="">Sem imóvel vinculado</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data" required>
                </div>

                <div class="campo">
                    <label>Valor(R$)</label>
                    <input type="number" id="valor" required>
                </div>

            </div>

            <div class="modal-contrato-acoes">

                <button type="button" class="btn-cancelar-contrato"
                    id="btn-cancelar">
                    Cancelar
                </button>

                <button type="submit" class="btn-salvar">
                    Salvar
                </button>

            </div>

        </form>

    </div>
</div>
<script src="js/financeiro.js"></script>
</body>

</html>
