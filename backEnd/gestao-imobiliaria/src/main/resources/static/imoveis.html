<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>InterCruz - Imóveis</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="layout">

    <!-- MENU -->

    <aside class="sidebar">

        <div class="logo">

            <h2>INTERCRUZ</h2>

            <span>
                FUNDAÇÃO MANUEL CRUZ
            </span>

        </div>

        <nav>

                <a href="index.html" class="menu-item">
                     <img src="icons/tabDashboard.png" alt="" class="menu-icon">
                    <span>Dashboard</span>
                </a>

                <a href="imoveis.html" class="menu-item active">
                    <img src="icons/imoveisActivated.png" alt="" class="menu-icon">
                    <span>Imóveis</span>
                </a>

                <a href="contratos.html" class="menu-item">
                    <img src="icons/tabContratos.png" alt="" class="menu-icon">
                    <span>Contratos</span>
                </a>

                <a href="clientes.html" class="menu-item">
                    <img src="icons/tabClientes.png" alt="" class="menu-icon">
                    <span>Clientes</span>
                </a>

                <a href="financeiro.html" class="menu-item">
                    <img src="icons/tabFinanceiro.png" alt="" class="menu-icon">
                    <span>Financeiro</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/tabDocumentos.png" alt="" class="menu-icon">
                    <span>Documentos</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/tabPrestacao.png" alt="" class="menu-icon">
                    <span>Prestação de contas</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/tabRelatorios.png" alt="" class="menu-icon">
                    <span>Relatórios</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="icons/configuracoes.png" alt="" class="menu-icon">
                    <span>Configurações</span>
                </a>

        </nav>

        <div class="menu-sair">
            <img src="icons/iconSair.png" alt="" class="menu-icon">
                    <span>Sair</span>
        </div>

    </aside>


    <!-- CONTEÚDO -->

    <main class="main-content">

        <header class="topbar">
            <h1>Imóveis</h1>
        </header>

        <section class="content">

            <div class="page-header">

                <div>

                    <h2>Imóveis</h2>

                </div>


                <!-- BOTÃO QUE ABRE O MODAL -->

                <button
                    type="button"
                    id="btn-novo-imovel"
                    class="btn-novo-imovel">

                    + Novo imóvel

                </button>

            </div>


            <!-- FILTROS -->

            <div class="filters">

                <input
                    type="text"
                    id="campoBusca"
                    class="form-control"
                    placeholder="Buscar por código, endereço, bairro..."
                >

                <select
                    id="filtroTipo"
                    class="form-select">

                    <option value="">
                        Todos os tipos
                    </option>

                    <option value="APARTAMENTO">
                        Apartamento
                    </option>

                    <option value="CASA">
                        Casa
                    </option>

                    <option value="TERRENO">
                        Terreno
                    </option>

                    <option value="GALPAO">
                        Galpão
                    </option>

                    <option value="COMERCIAL">
                        Comercial
                    </option>

                </select>


                <select
                    id="filtroSituacao"
                    class="form-select">

                    <option value="">
                        Todas as situações
                    </option>

                    <option value="ALUGADO">
                        Alugado
                    </option>

                    <option value="DISPONIVEL">
                        Disponível
                    </option>

                    <option value="EM_MANUTENCAO">
                        Em Manutenção
                    </option>

                </select>


                <select id="filtroBairro" class="form-select"> 

                    <option value="">Todos os bairros</option>
                </select>
                

            </div>


            <!-- TABELA -->

            <div class="table-container">

                <table class="table">

                    <thead>

                        <tr>

                            <th>Código</th>

                            <th>Endereço</th>

                            <th>Tipo</th>

                            <th>Situação</th>

                            <th>Inquilino</th>

                            <th>Aluguel</th>

                            <th>Contrato</th>

                            <th>Ações</th>

                        </tr>

                    </thead>


                    <tbody id="lista-imoveis">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- ================================================== -->
<!-- MODAL DE CADASTRO -->
<!-- ================================================== -->
<div id="modal-imovel" class="modal">

    <div class="modal-conteudo">

        <div class="modal-cabecalho">

            <h2>Cadastrar imóvel</h2>

            <button
                type="button"
                id="btn-fechar-modal"
                class="btn-fechar">

                ×

            </button>

        </div>


        <form id="form-imovel">

            <!-- CÓDIGO -->

            <div class="campo">

                <label for="codigo">
                    Código
                </label>

                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    placeholder="Ex: IMV-001"
                    required>

            </div>


            <!-- TIPO -->

            <div class="campo">

                <label for="tipo">
                    Tipo
                </label>

                <select id="tipo" name="tipo">

                    <option value="">
                        Selecione
                    </option>

                    <option value="APARTAMENTO">
                        Apartamento
                    </option>

                    <option value="CASA">
                        Casa
                    </option>

                    <option value="TERRENO">
                        Terreno
                    </option>

                    <option value="GALPAO">
                        Galpão
                    </option>

                    <option value="COMERCIAL">
                        Comercial
                    </option>

                </select>

            </div>


            <!-- ENDEREÇO -->

            <div class="campo">

                <label for="endereco">
                    Endereço
                </label>

                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    placeholder="Rua, número"
                    required>

            </div>


            <!-- BAIRRO -->

            <div class="campo">

                <label for="bairro">
                    Bairro
                </label>

                <input
                    type="text"
                    id="bairro"
                    name="bairro"
                    placeholder="Ex: Centro"
                    required>

            </div>


            <!-- CIDADE -->

            <div class="campo">

                <label for="cidade">
                    Cidade
                </label>

                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    placeholder="Ex: Manaus"
                    required>

            </div>


            <!-- SITUAÇÃO -->

            <div class="campo">

                <label for="situacao">
                    Situação
                </label>

                <select id="situacao" name="situacao" required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="DISPONIVEL">
                        Disponível
                    </option>

                    <option value="ALUGADO">
                        Alugado
                    </option>

                    <option value="EM_MANUTENCAO">
                        Em manutenção
                    </option>

                </select>

            </div>


            <!-- VALOR E ÁREA -->

            <div class="linha-campos">

                <div class="campo">

                    <label for="valor">
                        Valor do aluguel
                    </label>

                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        placeholder="Ex: 12000"
                        min="0"
                        step="0.01"
                        required>

                </div>


                <div class="campo">

                    <label for="area">
                        Área (m²)
                    </label>

                    <input
                        type="number"
                        id="area"
                        name="area"
                        placeholder="Ex: 80"
                        min="0"
                        step="0.01"
                        required>

                </div>

            </div>


            <!-- QUARTOS -->

            <div class="campo">

                <label for="quartos">
                    Quartos
                </label>

                <input
                    type="number"
                    id="quartos"
                    name="quartos"
                    placeholder="Ex: 3"
                    min="0"
                    required>

            </div>


            <!-- OBSERVAÇÕES -->

            <div class="campo">

                <label for="observacoes">
                    Observações
                </label>

                <textarea
                    id="observacoes"
                    name="observacoes"
                    placeholder="Digite informações adicionais sobre o imóvel..."
                    rows="4"></textarea>

            </div>


            <!-- BOTÕES -->

            <div class="modal-acoes">

                <button
                    type="button"
                    id="btn-cancelar"
                    class="btn-cancelar">

                    Cancelar

                </button>


                <button
                    type="submit"
                    class="btn-salvar">

                    Salvar
                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/imoveis.js"></script>

</body>

</html>
